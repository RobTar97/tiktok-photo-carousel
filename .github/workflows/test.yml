name: test

on:
  push:
  pull_request:

jobs:
  html-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r skills/tiktok-photo-carousel/requirements.txt
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Every template renders, fits and clears the safe zones
        run: node skills/tiktok-photo-carousel/scripts/selftest.js
      - name: Build the example gallery
        run: |
          node skills/tiktok-photo-carousel/scripts/build.js             --deck examples/gallery/deck.json --out examples/gallery/carousel.html
          node skills/tiktok-photo-carousel/scripts/export.js             --html examples/gallery/carousel.html --out out/gallery --no-contact --strict
      - name: Readability audit of the exported slides
        run: python skills/tiktok-photo-carousel/scripts/audit.py --out out/gallery --strict

  legacy-pil:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r skills/tiktok-photo-carousel/requirements.txt
      - run: python skills/tiktok-photo-carousel/scripts/selftest.py
      - name: Analyse the example photos
        run: python skills/tiktok-photo-carousel/scripts/analyze.py --photos examples/photos --out out/analysis.json
      - name: Render the legacy example
        run: python skills/tiktok-photo-carousel/scripts/carousel.py --photos examples/photos --script examples/demo-script.json --out out --style editorial
